<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Peccioli Eyes">
  <meta name="theme-color" content="#130089">
  <meta name="format-detection" content="telephone=no">
  <title>Peccioli Eyes to New Orleans</title>

  <!-- Manifest e icone -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  
  <!-- Apple touch icons in tutte le dimensioni -->
  <link rel="apple-touch-icon" href="apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120.png">
  
  <!-- Apple splash screens per ogni iPhone -->
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash-1290x2796.png">
  <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash-1284x2778.png">
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash-1179x2556.png">
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash-1170x2532.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash-1242x2688.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash-828x1792.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash-1125x2436.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash-750x1334.png">
  <link rel="apple-touch-startup-image" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash-640x1136.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #130089;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      /* Safe area iOS */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      box-sizing: border-box;
    }

    /* Mini splash di apertura (visibile solo nei primi 1-2 secondi mentre carica l'iframe) */
    #splash {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(165deg, #0a0052 0%, #130089 55%, #1a0fb8 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }
    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    #splash img {
      width: 130px;
      height: auto;
      animation: pulse 1.4s ease-in-out infinite;
    }
    #splash .divider {
      width: 40px;
      height: 3px;
      background: #FFDE59;
      border-radius: 3px;
      margin: 1.2rem 0 0.8rem;
      opacity: 0.8;
    }
    #splash .label {
      color: rgba(255, 222, 89, 0.85);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    /* Iframe a tutto schermo */
    #portal-frame {
      position: fixed;
      top: env(safe-area-inset-top);
      left: 0;
      right: 0;
      bottom: env(safe-area-inset-bottom);
      width: 100%;
      height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      border: 0;
      background: #130089;
      display: block;
    }

    /* Stato offline */
    #offline-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #FFDE59;
      color: #130089;
      padding: 0.7rem 1rem calc(0.7rem + env(safe-area-inset-bottom));
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      z-index: 10000;
      transform: translateY(100%);
      transition: transform 0.3s ease-out;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
    }
    #offline-banner.show {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Splash overlay (sparisce dopo onload dell'iframe) -->
  <div id="splash">
    <img src="peccioli_eyes_logo_white.png" alt="Peccioli Eyes">
    <div class="divider"></div>
    <div class="label">to New Orleans · 2026</div>
  </div>

  <!-- Iframe con il portale Streamlit -->
  <iframe 
    id="portal-frame"
    src="https://new-orleans.onrender.com"
    allow="geolocation; fullscreen; camera; microphone; clipboard-write"
    referrerpolicy="origin"
    sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-downloads allow-modals allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation">
  </iframe>

  <!-- Banner offline -->
  <div id="offline-banner">⚠ Sei offline · Alcune funzioni potrebbero non funzionare</div>

  <script>
    // Splash: nascondi appena l'iframe è caricato (massimo 4 secondi di garanzia)
    const splash = document.getElementById('splash');
    const iframe = document.getElementById('portal-frame');
    
    function hideSplash() {
      splash.classList.add('hide');
      setTimeout(() => splash.style.display = 'none', 600);
    }
    
    iframe.addEventListener('load', () => {
      // Aspetta un attimo extra per far stabilizzare l'app dentro
      setTimeout(hideSplash, 800);
    });
    
    // Fallback: nascondi splash dopo max 4 secondi
    setTimeout(hideSplash, 4000);

    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // Banner offline
    const offlineBanner = document.getElementById('offline-banner');
    function updateOnlineStatus() {
      if (navigator.onLine) {
        offlineBanner.classList.remove('show');
      } else {
        offlineBanner.classList.add('show');
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    // Gestisci shortcuts del manifest (es. ?goto=mappa)
    const urlParams = new URLSearchParams(window.location.search);
    const goto = urlParams.get('goto');
    if (goto) {
      iframe.addEventListener('load', () => {
        // Aggiunge l'anchor al portale per scrollare alla sezione
        try {
          iframe.contentWindow.location.hash = '#' + goto;
        } catch(e) {}
      }, { once: true });
    }

    // Previeni zoom pinch su iOS dentro l'app
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('gesturechange', (e) => e.preventDefault());
    
    // Disabilita context menu (long-press) per look più nativo
    document.addEventListener('contextmenu', (e) => {
      if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
      }
    });
  </script>

</body>
</html>
